[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools" ]

[project]
name = "data-slice"
version = "1.0.0"
description = """\
  DataSlicer is a powerful and lightweight Python tool designed to efficiently split large CSV and Excel (XLSX) files \
  into smaller, more manageable chunks.\
  """
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Mark Moreno", email = "mark@securehst.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "pathvalidate>=3.2.3",
  "rich>=13.9.4",
]
urls."Bug Tracker" = "https://github.com/markm-io/dataslicer/issues"
urls.Changelog = "https://github.com/markm-io/dataslicer/blob/main/CHANGELOG.md"
urls.documentation = "https://dataslicer.readthedocs.io"
urls.repository = "https://github.com/markm-io/dataslicer"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
]
docs = [
  "myst-parser>=0.16; python_version>='3.11'",
  "sphinx>=4; python_version>='3.11'",
  "sphinx-autobuild>=2025,<2026; python_version>='3.11'",
  "sphinx-wagtail-theme>=6.5; python_version>='3.11'",
]

[tool.ruff]
target-version = "py39"
line-length = 120
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle
  "F",   # pyflake
  "I",   # isort
  "RUF", # ruff specific
  "S",   # flake8-bandit
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in `__init__`
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D401", # First line of docstring should be in imperative mood
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."docs/conf.py" = [ "D100" ]
lint.per-file-ignores."setup.py" = [ "D100" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "S101",
]
lint.isort.known-first-party = [ "dataslicer", "tests" ]

[tool.mypy]
mypy_path = "src/"
exclude = [
  "docs/.*",
  "setup.py",
]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_unreachable = true
overrides = [ { module = "tests.*", allow_untyped_defs = true }, { module = "docs.*", ignore_errors = true } ]
no_implicit_optional = true
show_error_codes = true

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = """\
    -v
    -Wdefault
    --cov=dataslicer
    --cov-report=term
    --cov-report=xml
    """

[tool.coverage]
run.branch = true
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.semantic_release]
version_variables = [
  "src/dataslicer/__init__.py:__version__",
  "docs/conf.py:release",
]
version_toml = [ "pyproject.toml:project.version" ]
build_command = """
pip install uv
uv lock
git add uv.lock
uv build
"""
branches.main.match = "main"
branches.noop.match = "(?!main$)"
branches.noop.prerelease = true
changelog.environment.keep_trailing_newline = true
changelog.exclude_commit_patterns = [
  '''chore(?:\([^)]*?\))?: .+''',
  '''ci(?:\([^)]*?\))?: .+''',
  '''refactor(?:\([^)]*?\))?: .+''',
  '''style(?:\([^)]*?\))?: .+''',
  '''test(?:\([^)]*?\))?: .+''',
  '''build\((?!deps\): .+)''',
  "Merged? .*",
  "Initial [Cc]ommit.*",             # codespell:ignore
]
